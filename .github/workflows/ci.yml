name: lint · test · audit

# Run on pushes to main, on every pull request, and weekly (Mondays, before the update report), so a new
# release of a dependency or runner image that breaks the suite shows up even in a week with no commits.
# The GPU-free suite mocks ComfyUI, so it runs on a clean runner with no models, no GPU, no server.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

# Read-only by default. Actions are pinned by commit SHA (Dependabot keeps the pins current), and only
# the upload job below can mint an OIDC token: the jobs that pip-install third-party packages can't.
permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} · py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Developed on Windows; Linux proves the "anyone can fork this" promise.
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]
        # Newer Pythons on Linux too. They aren't required checks (the two 3.12 jobs are); a red one says the
        # next Python upgrade has work to do (docs/MAINTENANCE.md).
        include:
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0   # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # Linux adds the [print] and [images] extras, so the --solid rebuild, the STL print check, the contact sheet
      # the judge scores (montage.py) and the Pillow cross-checks run and count toward coverage. Windows stays on
      # [dev] and proves the no-Pillow fallbacks: scikit-image in [print] pulls in Pillow, so the 9 Pillow-gated
      # and 39 print-gated tests skip there.
      - name: Install (editable + dev tooling)
        run: python -m pip install -e ".[dev${{ matrix.os == 'ubuntu-latest' && ',print,images' || '' }}]"
      - name: Lint (ruff — correctness rules)
        run: ruff check .
      - name: Run tests (with coverage)
        run: python -m pytest --cov=scripts --cov-report=term-missing --cov-report=xml --cov-fail-under=85
      - name: Keep the coverage report for the upload job
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: coverage
          path: coverage.xml
          retention-days: 1
      - name: CLI entry point smoke
        run: chimera --help

  coverage:
    name: upload coverage
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # OIDC: lets codecov-action do a tokenless upload (no CODECOV_TOKEN needed)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333   # v8.0.2
        with:
          name: coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5   # v7.1.1
        with:
          files: ./coverage.xml
          use_oidc: true
        continue-on-error: true   # advisory — never gate the merge on the coverage upload

  audit:
    name: pip-audit
    runs-on: ubuntu-latest
    continue-on-error: true   # advisory: surface CVEs in the dep tree without gating the merge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0   # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Audit dependencies for known advisories
        run: |
          python -m pip install -e ".[dev,print]" pip-audit
          pip-audit --desc
